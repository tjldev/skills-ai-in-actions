name: Ask AI

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ask-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Azure OpenAI access token
        id: get-token
        run: |
          set -euo pipefail
          TOKEN=$(az account get-access-token \
            --resource https://cognitiveservices.azure.com \
            --query accessToken -o tsv)
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Call Azure AI Foundry
        id: ai-response
        env:
          AZURE_OPENAI_ENDPOINT: https://tlaurence-2242-resource.services.ai.azure.com/openai/v1
          AZURE_OPENAI_DEPLOYMENT: gpt-5-mini
          AZURE_OPENAI_TOKEN: ${{ steps.get-token.outputs.token }}
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sS "$AZURE_OPENAI_ENDPOINT/responses" \
            -H "Content-Type: application/json" \
            -H "Authorization: ******" \
            -d '{
              "model": "'"$AZURE_OPENAI_DEPLOYMENT"'",
              "input": "Give me a programming joke."
            }')

          echo "$RESPONSE" > response.json
          echo "response=$(jq -r '.output[0].content[0].text // .choices[0].message.content // empty' response.json)" >> "$GITHUB_OUTPUT"

      - name: Display AI Response
        run: |
          echo "## 🤖 AI Response" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.ai-response.outputs.response }}" >> $GITHUB_STEP_SUMMARY
