name: Ask AI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ask-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Call Azure AI Foundry
        id: ai-response
        env:
          AZURE_OPENAI_ENDPOINT: https://tlaurence-2242-resource.services.ai.azure.com/openai/v1
          AZURE_OPENAI_DEPLOYMENT: gpt-5-mini
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${AZURE_OPENAI_API_KEY:-}" ]; then
            echo "AZURE_OPENAI_API_KEY secret is not configured." >&2
            exit 1
          fi

          RESPONSE=$(curl -sS "$AZURE_OPENAI_ENDPOINT/responses" \
            -H "Content-Type: application/json" \
            -H "api-key: $AZURE_OPENAI_API_KEY" \
            -d '{
              "model": "'"$AZURE_OPENAI_DEPLOYMENT"'",
              "input": "Give me a programming joke."
            }')

          echo "$RESPONSE" > response.json
          echo "response=$(jq -r '.output[0].content[0].text // .choices[0].message.content // empty' response.json)" >> "$GITHUB_OUTPUT"

      - name: Display AI Response
        run: |
          echo "## 🤖 AI Response" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.ai-response.outputs.response }}" >> $GITHUB_STEP_SUMMARY
