name: Issue Completeness

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  analyze:
    name: AI Issue Completeness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Azure OpenAI access token
        id: get-token
        run: |
          set -euo pipefail
          TOKEN=$(az account get-access-token \
            --resource https://cognitiveservices.azure.com \
            --query accessToken -o tsv)
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Analyze issue with AI
        id: ai-response
        env:
          AZURE_OPENAI_ENDPOINT: https://tlaurence-2242-resource.services.ai.azure.com/openai/v1
          AZURE_OPENAI_DEPLOYMENT: gpt-5-mini
          AZURE_OPENAI_TOKEN: ${{ steps.get-token.outputs.token }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sS "$AZURE_OPENAI_ENDPOINT/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: ******" \
            -d "$(jq -n \
              --arg model "$AZURE_OPENAI_DEPLOYMENT" \
              --arg system "You are a GitHub issue assistant. Your task is to analyze newly opened issues for completeness.\n\nProvide concise, helpful suggestions, ask clarifying questions and identify any missing information that would help resolve the issue faster.\n\nAlways respond with ready-to-use markdown content (no code blocks) that can be posted directly as an issue comment.\n\nSign off as AI assistant." \
              --arg user "New issue was opened by $ISSUE_USER\nTitle: $ISSUE_TITLE\nBody:\n---\n$ISSUE_BODY\n---" \
              '{model: $model, max_completion_tokens: 1000, messages: [{role: "system", content: $system}, {role: "user", content: $user}]}')")

          echo "$RESPONSE" > response.json
          {
            echo "response<<EOF"
            jq -r '.choices[0].message.content // empty' response.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment results on the issue
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: ${{ steps.ai-response.outputs.response }}
